name: Lint
on: [push, pull_request]

jobs:
  build:
    name: ansible-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.10.1
        with:
          working_directory: pan-os-ansible
          requirements_file: collections/requirements.yml
